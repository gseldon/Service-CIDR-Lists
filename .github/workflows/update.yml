name: Update IP lists

on:
  schedule:
    - cron: "17 4 * * *" # ежедневно в 04:17 UTC
  workflow_dispatch: # ручной запуск из вкладки Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update lists
        run: python scripts/update_lists.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update IP lists"
            git push
          fi
